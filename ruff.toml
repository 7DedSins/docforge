line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
]
ignore = [
    # FastAPI's dependency-injection idiom is `arg = Depends(...)` in the
    # signature, which bugbear flags as a mutable/function call default.
    "B008",
]

[lint.per-file-ignores]
# Fixtures shadow their own names by design, and conftest deliberately imports
# after setting environment variables.
"tests/*" = ["E402"]
# Holds the landing page as one HTML string. Wrapping a <meta> description or a
# CSS rule to satisfy a Python line limit would corrupt the markup.
"gateway/app/ui.py" = ["E501"]
