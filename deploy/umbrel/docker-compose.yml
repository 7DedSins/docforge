version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: docforge_gateway_1
      APP_PORT: 8000
      # Umbrel puts every app behind its own login. That is right for a web UI
      # and fatal for an API: a script or an AI agent has no Umbrel session
      # cookie, so without this whitelist every programmatic call is bounced to
      # a login page and the app is only usable by a human in a browser.
      #
      # These endpoints carry their own authentication — an API key, or a
      # marketplace proxy secret — so they are not being left unprotected, only
      # authenticated by the right mechanism.
      PROXY_AUTH_WHITELIST: "/v1/*,/mcp,/mcp/*,/health,/openapi.json"

  gateway:
    image: ghcr.io/7dedsins/docforge-gateway:1.3.0@sha256:c87a54127aa63214be07265e784ec13d61382be457f9902fbf59f81dd2d5cb26
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - DOCFORGE_GOTENBERG_URL=http://docforge_gotenberg_1:3000
      - DOCFORGE_DB_PATH=/data/docforge.db
      - DOCFORGE_DOMAIN=$DEVICE_DOMAIN_NAME
      - DOCFORGE_FREE_TIER_MONTHLY=250
      # Conservative for a home box. An Umbrel is often a Raspberry Pi sharing
      # CPU with Bitcoin Core and half a dozen other apps.
      - DOCFORGE_MAX_CONCURRENT_DOCS=4
      - DOCFORGE_MAX_CONCURRENT_IMAGES=2
      - DOCFORGE_DEMO_PER_DAY=3
    volumes:
      - ${APP_DATA_DIR}/data:/data

  mcpserver:
    image: ghcr.io/7dedsins/docforge-mcpserver:1.3.0@sha256:5369f4c542ca12bf2d7336a10eb85ab2aac714400f51cb4f70d1dfd9203ba752
    restart: on-failure
    environment:
      - DOCFORGE_GATEWAY_URL=http://docforge_gateway_1:8000
      # The Host header arriving through the proxy is the device's own name,
      # which the SDK's rebinding guard cannot guess. Listing it keeps the
      # guard on rather than switching it off wholesale.
      - DOCFORGE_DOMAIN=$DEVICE_DOMAIN_NAME
      - DOCFORGE_MCP_ALLOWED_HOSTS=$DEVICE_DOMAIN_NAME:*,umbrel.local:*
      # Empty on purpose: each caller sends their own key and is metered
      # against their own quota.
      - DOCFORGE_API_KEY=

  gotenberg:
    image: ghcr.io/7dedsins/docforge-gotenberg:1.3.0@sha256:f45e46af951aa0fb7d3a4e59b2d395f2ca307efd1b453a61724a5c695eb30c2e
    restart: on-failure
    command:
      - "gotenberg"
      - "--api-port=3000"
      - "--api-timeout=120s"
      - "--libreoffice-restart-after=50"
      - "--chromium-max-queue-size=20"
      # Callers control what gets rendered, so both engines will fetch whatever
      # a caller references. Unrestricted on an Umbrel that means a probe for
      # every other app on the device — including the Bitcoin node's RPC.
      - '--chromium-deny-list=^file:(?!//\/tmp/).*'
      - '--chromium-deny-list=^.*://(localhost|0\.0\.0\.0|\[::1\]|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|169\.254\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)'
      - '--chromium-deny-list=^.*://(docforge_[a-z]+_1|host\.docker\.internal)'
      - '--libreoffice-deny-list=^.*://(localhost|0\.0\.0\.0|\[::1\]|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|169\.254\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)'
      - '--libreoffice-deny-list=^.*://(docforge_[a-z]+_1|host\.docker\.internal)'
