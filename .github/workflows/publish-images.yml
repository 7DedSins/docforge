name: Publish images

# Self-hosted app stores — CasaOS, Umbrel, Unraid, Coolify — install from a
# published image. They cannot build from source, so without this the project
# is not listable on any of them.
#
# arm64 is not optional for that audience: a large share of self-hosters run
# a Raspberry Pi or an ARM mini-PC, and an amd64-only image is simply
# uninstallable for them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway
            context: ./gateway
          - image: mcpserver
            context: ./mcpserver
          - image: gotenberg
            context: ./gotenberg

    steps:
      - uses: actions/checkout@v4

      # QEMU emulates arm64 on an amd64 runner. Slower than native, but the
      # alternative is no arm64 image at all.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docforge-${{ matrix.image }}
          # On a tag: 1.2.0, 1.2, 1, latest. On a manual run: edge.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=DocForge ${{ matrix.image }}
            org.opencontainers.image.description=Document conversion and image rendering API
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image, or the three builds evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
