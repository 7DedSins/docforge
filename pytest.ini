[pytest]
# The application package lives under gateway/, so `from app import ...`
# resolves without an editable install or sys.path juggling in conftest.
pythonpath = gateway
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    # FastAPI's on_event API is deprecated in favour of lifespan handlers.
    # Tracked separately; not worth failing CI over.
    ignore::DeprecationWarning
